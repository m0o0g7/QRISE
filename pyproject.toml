[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qrise-components-reconstruction"
version = "0.1.0"
description = "Q-RISE planning and physical execution with NetSquid components"
readme = "README.md"
requires-python = ">=3.7"
dependencies = ["numpy", "networkx", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py37"]
# Frozen experiment snapshots retain their original bytes.
force-exclude = "/outputs/"
